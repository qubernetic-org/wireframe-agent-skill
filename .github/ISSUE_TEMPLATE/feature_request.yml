name: Feature Request
description: Suggest a new component, pattern, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What component, pattern, or improvement would you like to see?
      placeholder: "e.g., Add a modal/dialog wireframe component"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: When would this be useful? What kind of wireframes need this?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example Output
      description: If possible, sketch or describe what the component should look like (remember — grayscale, dashed borders, monospace only).
    validations:
      required: false
